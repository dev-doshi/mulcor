[versions]
minestom = "2026.09.12-26.2"
netty = "4.2.18.Final"
junit = "6.1.3"
jcstress = "0.16"
jmh = "1.37"
hdrhistogram = "2.2.2"
archunit = "1.5.0"
jctools = "4.0.7"
disruptor = "4.0.0"

[libraries]
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-buffer = { module = "io.netty:netty-buffer" }
netty-handler = { module = "io.netty:netty-handler" }
netty-transport = { module = "io.netty:netty-transport" }
netty-transport-epoll = { module = "io.netty:netty-transport-native-epoll" }
netty-transport-kqueue = { module = "io.netty:netty-transport-native-kqueue" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jcstress-core = { module = "org.openjdk.jcstress:jcstress-core", version.ref = "jcstress" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
hdrhistogram = { module = "org.hdrhistogram:HdrHistogram", version.ref = "hdrhistogram" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jctools = { module = "org.jctools:jctools-core", version.ref = "jctools" }
disruptor = { module = "com.lmax:disruptor", version.ref = "disruptor" }
