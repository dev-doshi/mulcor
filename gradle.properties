org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g
# Homebrew JDKs are not registered with /usr/libexec/java_home; point toolchain detection at them explicitly.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false
